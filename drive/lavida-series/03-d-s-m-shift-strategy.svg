<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720">
<rect width="1200" height="720" fill="white"/>
<style>text{font-family:Arial,"Noto Sans SC",sans-serif;fill:#222}.t{font-size:28px;font-weight:700}.s{font-size:18px}.a{font-size:15px}.g{stroke:#ddd;stroke-width:1}.axis{stroke:#222;stroke-width:2}.d{fill:none;stroke:#3973ac;stroke-width:4}.sline{fill:none;stroke:#d47a12;stroke-width:4}.m{fill:none;stroke:#3c8c5a;stroke-width:4}</style>
<text x="600" y="42" text-anchor="middle" class="t">朗逸 1.5L 6AT：D / S / M 的代表性转速策略</text>
<text x="600" y="70" text-anchor="middle" class="s">示意模型：D≈2200 rpm 升挡、S≈3500 rpm 升挡、M 主动加速≈5800 rpm 升挡</text>
<line x1="100" y1="610" x2="1100" y2="610" class="axis"/><line x1="100" y1="110" x2="100" y2="610" class="axis"/>
<line x1="100" y1="110" x2="100" y2="610" class="g"/><text x="100" y="640" text-anchor="middle" class="a">0</text><line x1="300" y1="110" x2="300" y2="610" class="g"/><text x="300" y="640" text-anchor="middle" class="a">20</text><line x1="500" y1="110" x2="500" y2="610" class="g"/><text x="500" y="640" text-anchor="middle" class="a">40</text><line x1="700" y1="110" x2="700" y2="610" class="g"/><text x="700" y="640" text-anchor="middle" class="a">60</text><line x1="900" y1="110" x2="900" y2="610" class="g"/><text x="900" y="640" text-anchor="middle" class="a">80</text><line x1="1100" y1="110" x2="1100" y2="610" class="g"/><text x="1100" y="640" text-anchor="middle" class="a">100</text>
<line x1="100" y1="560" x2="1100" y2="560" class="g"/><text x="82" y="565" text-anchor="end" class="a">1000</text><line x1="100" y1="475" x2="1100" y2="475" class="g"/><text x="82" y="480" text-anchor="end" class="a">2000</text><line x1="100" y1="390" x2="1100" y2="390" class="g"/><text x="82" y="395" text-anchor="end" class="a">3000</text><line x1="100" y1="305" x2="1100" y2="305" class="g"/><text x="82" y="310" text-anchor="end" class="a">4000</text><line x1="100" y1="220" x2="1100" y2="220" class="g"/><text x="82" y="225" text-anchor="end" class="a">5000</text><line x1="100" y1="135" x2="1100" y2="135" class="g"/><text x="82" y="140" text-anchor="end" class="a">6000</text>
<text x="600" y="682" text-anchor="middle" class="s">车速 km/h</text><text x="30" y="360" transform="rotate(-90 30 360)" text-anchor="middle" class="s">发动机转速 rpm</text>
<polyline class="d" points="100,530 220,410 225,520 390,390 395,520 600,410 605,520 820,440 825,520 1100,440"/>
<polyline class="sline" points="100,520 260,350 265,475 480,315 485,445 720,300 725,430 980,305 985,425 1100,360"/>
<polyline class="m" points="100,500 360,155 365,330 650,155 655,285 1000,155 1005,270 1100,230"/>
<line x1="760" y1="530" x2="820" y2="530" class="d"/><text x="835" y="536" class="a">D：低转、积极升挡</text>
<line x1="760" y1="560" x2="820" y2="560" class="sline"/><text x="835" y="566" class="a">S：延迟升挡、保留动力</text>
<line x1="760" y1="590" x2="820" y2="590" class="m"/><text x="835" y="596" class="a">M：按道路预判主动管理功率带</text>
</svg>