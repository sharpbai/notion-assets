<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720">
<rect width="1200" height="720" fill="white"/>
<style>text{font-family:Arial,"Noto Sans SC",sans-serif;fill:#222}.t{font-size:28px;font-weight:700}.s{font-size:18px}.a{font-size:15px}.g{stroke:#ddd;stroke-width:1}.axis{stroke:#222;stroke-width:2}</style>
<text x="600" y="42" text-anchor="middle" class="t">朗逸 M2：从发动机制动到正加速的连续控制区间</text>
<text x="600" y="70" text-anchor="middle" class="s">平路工程模型；0%附近的闭油/恢复喷油过渡并非严格线性</text>
<line x1="100" y1="600" x2="1100" y2="600" class="axis"/><line x1="100" y1="105" x2="100" y2="600" class="axis"/>
<line x1="100" y1="105" x2="100" y2="600" class="g"/><text x="100" y="635" text-anchor="middle" class="a">0%</text><line x1="300" y1="105" x2="300" y2="600" class="g"/><text x="300" y="635" text-anchor="middle" class="a">20%</text><line x1="500" y1="105" x2="500" y2="600" class="g"/><text x="500" y="635" text-anchor="middle" class="a">40%</text><line x1="700" y1="105" x2="700" y2="600" class="g"/><text x="700" y="635" text-anchor="middle" class="a">60%</text><line x1="900" y1="105" x2="900" y2="600" class="g"/><text x="900" y="635" text-anchor="middle" class="a">80%</text><line x1="1100" y1="105" x2="1100" y2="600" class="g"/><text x="1100" y="635" text-anchor="middle" class="a">100%</text>
<line x1="100" y1="550" x2="1100" y2="550" class="g"/><text x="82" y="555" text-anchor="end" class="a">-1.5</text><line x1="100" y1="488" x2="1100" y2="488" class="g"/><text x="82" y="493" text-anchor="end" class="a">-1.0</text><line x1="100" y1="426" x2="1100" y2="426" class="g"/><text x="82" y="431" text-anchor="end" class="a">-0.5</text><line x1="100" y1="364" x2="1100" y2="364" class="axis"/><text x="82" y="369" text-anchor="end" class="a">0.0</text><line x1="100" y1="302" x2="1100" y2="302" class="g"/><text x="82" y="307" text-anchor="end" class="a">0.5</text><line x1="100" y1="240" x2="1100" y2="240" class="g"/><text x="82" y="245" text-anchor="end" class="a">1.0</text><line x1="100" y1="178" x2="1100" y2="178" class="g"/><text x="82" y="183" text-anchor="end" class="a">1.5</text><line x1="100" y1="116" x2="1100" y2="116" class="g"/><text x="82" y="121" text-anchor="end" class="a">2.0</text>
<text x="600" y="682" text-anchor="middle" class="s">油门踏板位置（估算映射）</text><text x="28" y="355" transform="rotate(-90 28 355)" text-anchor="middle" class="s">净纵向加速度 m/s²</text>
<polyline points="100,465 180,370 300,300 500,235 700,185 900,145 1100,115" fill="none" stroke="#3973ac" stroke-width="4"/><text x="1010" y="135" class="a">40 km/h</text>
<polyline points="100,490 180,375 300,305 500,240 700,190 900,150 1100,120" fill="none" stroke="#6b9b65" stroke-width="4"/><text x="1010" y="155" class="a">50 km/h</text>
<polyline points="100,515 180,380 300,310 500,245 700,195 900,155 1100,125" fill="none" stroke="#d28a2f" stroke-width="4"/><text x="1010" y="175" class="a">60 km/h</text>
<polyline points="100,540 180,385 300,315 500,250 700,200 900,160 1100,130" fill="none" stroke="#b64c4c" stroke-width="4"/><text x="1010" y="195" class="a">70 km/h</text>
<text x="120" y="575" class="a">完全松油：发动机制动</text><text x="245" y="345" class="a">极轻油门：抵消反拖</text><text x="480" y="330" class="a">轻/中油门：正加速</text>
</svg>