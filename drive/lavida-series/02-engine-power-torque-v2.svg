<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720">
<rect width="1200" height="720" fill="white"/>
<style>text{font-family:Arial,"Noto Sans SC",sans-serif;fill:#222}.t{font-size:28px;font-weight:700}.s{font-size:18px}.a{font-size:16px}.g{stroke:#ddd;stroke-width:1}.axis{stroke:#222;stroke-width:2}.tor{fill:none;stroke:#1769aa;stroke-width:5}.pow{fill:none;stroke:#d97706;stroke-width:5;stroke-dasharray:12 8}.dot1{fill:#1769aa}.dot2{fill:#d97706}</style>
<text x="600" y="42" text-anchor="middle" class="t">朗逸 1.5L EA211：转速、扭矩与功率</text>
