<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720">
<rect width="1200" height="720" fill="white"/>
<style>text{font-family:Arial,"Noto Sans SC",sans-serif;fill:#222}.t{font-size:28px;font-weight:700}.s{font-size:18px}.a{font-size:15px}.g{stroke:#ddd;stroke-width:1}.axis{stroke:#222;stroke-width:2}</style>
<text x="600" y="42" text-anchor="middle" class="t">朗逸 1.5L：坡度如何吃掉净加速度（13.11s 零百校准模型）</text>
<text x="600" y="70" text-anchor="middle" class="s">代表性中等油门 D / S 与主动保持功率带的 M；用于比较趋势，不是厂家 TCU 标定</text>
<line x1="100" y1="600" x2="1100" y2="600" class="axis"/><line x1="100" y1="110" x2="100" y2="600" class="axis"/>
<line x1="150" y1="110" x2="150" y2="600" class="g"/><text x="150" y="635" text-anchor="middle" class="a">30</text><line x1="325" y1="110" x2="325" y2="600" class="g"/><text x="325" y="635" text-anchor="middle" class="a">40</text><line x1="500" y1="110" x2="500" y2="600" class="g"/><text x="500" y="635" text-anchor="middle" class="a">50</text><line x1="675" y1="110" x2="675" y2="600" class="g"/><text x="675" y="635" text-anchor="middle" class="a">60</text><line x1="850" y1="110" x2="850" y2="600" class="g"/><text x="850" y="635" text-anchor="middle" class="a">70</text><line x1="1025" y1="110" x2="1025" y2="600" class="g"/><text x="1025" y="635" text-anchor="middle" class="a">80</text>
<line x1="100" y1="545" x2="1100" y2="545" class="g"/><text x="82" y="550" text-anchor="end" class="a">-0.5</text><line x1="100" y1="455" x2="1100" y2="455" class="axis"/><text x="82" y="460" text-anchor="end" class="a">0.0</text><line x1="100" y1="365" x2="1100" y2="365" class="g"/><text x="82" y="370" text-anchor="end" class="a">0.5</text><line x1="100" y1="275" x2="1100" y2="275" class="g"/><text x="82" y="280" text-anchor="end" class="a">1.0</text><line x1="100" y1="185" x2="1100" y2="185" class="g"/><text x="82" y="190" text-anchor="end" class="a">1.5</text><line x1="100" y1="95" x2="1100" y2="95" class="g"/><text x="82" y="100" text-anchor="end" class="a">2.0</text>
<text x="600" y="682" text-anchor="middle" class="s">车速 km/h</text><text x="28" y="355" transform="rotate(-90 28 355)" text-anchor="middle" class="s">净加速度 m/s²</text>
<polyline points="150,430 325,445 500,465 675,485 850,510 1025,535" fill="none" stroke="#3973ac" stroke-width="4"/><text x="1035" y="535" class="a">D 中等油门 / 10%坡</text>
<polyline points="150,340 325,355 500,380 675,405 850,435 1025,470" fill="none" stroke="#d47a12" stroke-width="4"/><text x="1035" y="470" class="a">S 中等油门 / 10%坡</text>
