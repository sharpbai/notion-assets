<polyline points="150,105 325,125 500,150 675,180 850,215 1025,255" fill="none" stroke="#76a986" stroke-width="3" stroke-dasharray="10 7"/><text x="830" y="115" class="a">M 主动功率带 / 平路</text>
<text x="170" y="575" class="a">0 线以下：当前油门/挡位已不足以继续提高车速</text>
